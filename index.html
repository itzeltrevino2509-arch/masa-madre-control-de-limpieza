<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b5e3c">

<title>Masa Madre · Control de Limpieza</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f8f3ed;
  color:#403229;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  font:inherit;
}

.app{
  min-height:100vh;
  padding:24px 16px 40px;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  font-size:45px;
}

h1,h2,h3{
  font-family:Georgia,serif;
  color:#6b432b;
}

h1{
  margin:0;
  font-size:30px;
}

.subtitle{
  color:#806f64;
  margin-top:6px;
}

.screen{
  display:none;
  max-width:700px;
  margin:auto;
}

.screen.active{
  display:block;
}

.cards{
  display:grid;
  gap:17px;
}

.card{
  border:0;
  border-radius:25px;
  padding:25px;
  text-align:left;
  box-shadow:0 8px 24px rgba(74,48,31,.12);
  cursor:pointer;
}

.card:active{
  transform:scale(.98);
}

.cafe{
  background:linear-gradient(135deg,#ead6c2,#f8e9d9);
}

.kitchen{
  background:linear-gradient(135deg,#f0dfc7,#fff5e9);
}

.icon{
  font-size:40px;
}

.card h2{
  margin:8px 0 5px;
}

.card p{
  margin:0;
  color:#725f52;
}

.back{
  border:0;
  background:white;
  border-radius:14px;
  padding:10px 16px;
  margin-bottom:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  color:#65452f;
}

.section-title{
  font-size:25px;
  margin:10px 0 14px;
}

.small{
  font-size:14px;
  color:#88766a;
}

.task{
  background:white;
  border-radius:18px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 4px 15px rgba(74,48,31,.08);
}

.task-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.check{
  width:29px;
  height:29px;
  min-width:29px;
  border-radius:50%;
  border:2px solid #b98b68;
  background:white;
  color:white;
  display:grid;
  place-items:center;
  padding:0;
}

.check.done{
  background:#8b5e3c;
}

.task.done .name{
  text-decoration:line-through;
  opacity:.55;
}

.name{
  font-weight:650;
  flex:1;
}

.people{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:11px;
}

.person{
  border:1px solid #ddc5af;
  background:#fff7f0;
  border-radius:20px;
  padding:7px 11px;
  font-size:13px;
  color:#5e4638;
}

.person.selected{
  background:#8b5e3c;
  color:white;
  border-color:#8b5e3c;
}

.note{
  width:100%;
  border:1px solid #ead9ca;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
  background:#fffdfb;
}

.divider{
  height:1px;
  background:#ead9ca;
  margin:25px 0;
}

.footer{
  text-align:center;
  margin-top:32px;
  color:#9a887b;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">🥐</div>
  <h1>Masa Madre</h1>
  <p class="subtitle">Control de limpieza y organización</p>
</header>


<!-- INICIO -->

<section id="home" class="screen active">

  <div class="cards">

    <button class="card cafe" onclick="showScreen('bar')">
      <div class="icon">☕</div>
      <h2>Barra y Cafetería</h2>
      <p>Control diario y actividades programadas</p>
    </button>

    <button class="card kitchen" onclick="showScreen('kitchen')">
      <div class="icon">👩🏻‍🍳</div>
      <h2>Cocina</h2>
      <p>Limpieza diaria, profunda y actividades</p>
    </button>

  </div>

</section>


<!-- BARRA -->

<section id="bar" class="screen">

  <button class="back" onclick="showScreen('home')">
    ← Regresar
  </button>

  <h2 class="section-title">
    ☕ Barra y Cafetería
  </h2>

  <p class="small">
    Marca cada actividad conforme se vaya realizando.
  </p>

  <div id="barTasks"></div>

</section>


<!-- COCINA -->

<section id="kitchen" class="screen">

  <button class="back" onclick="showScreen('home')">
    ← Regresar
  </button>

  <h2 class="section-title">
    👩🏻‍🍳 Cocina
  </h2>

  <p class="small">
    Limpieza y organización del área.
  </p>


  <h3 class="section-title">
    🍽️ Limpieza diaria
  </h3>

  <div id="daily"></div>


  <div class="divider"></div>


  <h3 class="section-title">
    🧽 Limpieza profunda / semanal
  </h3>

  <div id="deep"></div>


  <div class="divider"></div>


  <h3 class="section-title">
    📅 Actividades programadas
  </h3>

  <div id="scheduled"></div>

</section>


<div class="footer">
  Masa Madre · Boulangerie
</div>

</div>


<script>

/* =========================
   PERSONAS
========================= */

const kitchenPeople = [
  "Jessica",
  "David",
  "Itzel · Cocina",
  "César",
  "Ángel"
];

const barPeople = [
  "Jessica",
  "Paola",
  "Itzel · Barra",
  "Ángela",
  "Karla"
];


/* =========================
   COCINA · LIMPIEZA DIARIA
========================= */

const kitchenDaily = [

  "Loza limpia, seca y acomodada",

  "Piso barrido y trapeado",

  "Plancha limpia",

  "Baños María limpios",

  "2 Microondas limpios",

  "Loza y utensilios acomodados",

  "Área de trabajo limpia y despejada",

  "Limpieza de derrames inmediata"

];


/* =========================
   COCINA · LIMPIEZA PROFUNDA
========================= */

const deepCleaning = [

  "Hornos – Limpieza profunda",

  "Charolas – Lavado y secado",

  "Paredes – Limpieza general",

  "Baños María – Vaciar y lavar",

  "Campana – Limpieza de grasa"

];


/* =========================
   ACTIVIDADES PROGRAMADAS
========================= */

const scheduledActivities = [

  "Acomodar Bodega – Viernes",

  "Acomodar Bodega – Sábado",

  "Limpieza profunda 2 cafeteras – Sábado",

  "Limpieza de Molino – Sábado",

  "Realizar Descaferinado – Sábado"

];


/* =========================
   BARRA Y CAFETERÍA
========================= */

const barActivities = [

  "Preparar Cold Brew",

  "Rellenar recibidor",

  "Tirar basura",

  "Acomodar pan",

  "Rellenar vasos (según sea necesario)",

  "Limpiar cafeteras por fuera",

  "Limpieza de mesas y sillas",

  "Limpieza profunda de baños",

  "Acomodar Bodega – Viernes",

  "Acomodar Bodega – Sábado",

  "Limpieza profunda 2 cafeteras – Sábado",

  "Limpieza de Molino – Sábado",

  "Realizar Descaferinado – Sábado"

];


/* =========================
   GUARDAR DATOS
========================= */

function storageKey(section,index,item){

  return "masa-madre-" +
         section +
         "-" +
         index +
         "-" +
         item;

}


/* =========================
   CREAR TAREAS
========================= */

function createTasks(items,people,target,section){

  const container =
    document.getElementById(target);

  container.innerHTML = "";


  items.forEach((item,index)=>{

    const id =
      storageKey(section,index,item);

    const completed =
      localStorage.getItem(id) === "done";

    const selectedPerson =
      localStorage.getItem(id+"-person") || "";


    const task =
      document.createElement("div");

    task.className =
      "task" +
      (completed ? " done" : "");


    task.innerHTML = `

      <div class="task-row">

        <button class="check ${completed ? "done" : ""}">
          ${completed ? "✓" : ""}
        </button>

        <div class="name">
          ${item}
        </div>

      </div>


      <div class="people">

        ${people.map(person => `

          <button
            class="person ${
              selectedPerson === person
              ? "selected"
              : ""
            }">

            ${person}

          </button>

        `).join("")}

      </div>


      <input
        class="note"
        placeholder="Observaciones (opcional)"
      >

    `;


    /* MARCAR COMO REALIZADA */

    task
      .querySelector(".check")
      .onclick = function(){

        if(completed){

          localStorage.removeItem(id);

        }else{

          localStorage.setItem(
            id,
            "done"
          );

        }

        renderAll();

      };


    /* SELECCIONAR RESPONSABLE */

    task
      .querySelectorAll(".person")
      .forEach(button=>{

        button.onclick = function(){

          localStorage.setItem(
            id+"-person",
            button.textContent.trim()
          );

          renderAll();

        };

      });


    container.appendChild(task);

  });

}


/* =========================
   RENDERIZAR TODO
========================= */

function renderAll(){

  createTasks(
    kitchenDaily,
    kitchenPeople,
    "daily",
    "kitchen-daily"
  );


  createTasks(
    deepCleaning,
    kitchenPeople,
    "deep",
    "kitchen-deep"
  );


  createTasks(
    scheduledActivities,
    kitchenPeople,
    "scheduled",
    "scheduled"
  );


  createTasks(
    barActivities,
    barPeople,
    "barTasks",
    "bar"
  );

}


/* =========================
   CAMBIAR DE PANTALLA
========================= */

function showScreen(screenId){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{

      screen.classList.remove("active");

    });


  document
    .getElementById(screenId)
    .classList.add("active");


  window.scrollTo(0,0);

}


/* =========================
   INICIAR
========================= */

renderAll();

</script>

</body>
</html>
